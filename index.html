<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>A sky for Aysha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..600&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #070d1f;
    --deep: #14274a;
    --gold: #ffd98a;
    --amber: #ffb454;
    --rose: #f4a6a0;
    --mist: #e3ebff;
    --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(180deg, var(--night) 0%, #0c1a38 55%, var(--deep) 100%);
    color: var(--mist);
    font-family: var(--font);
    font-optical-sizing: auto;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .horizon {
    position: fixed; left: -20%; right: -20%; bottom: -30%; height: 60%;
    background: radial-gradient(50% 50% at 50% 50%, rgba(255,180,84,.20), transparent 70%);
    pointer-events: none;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* heart lines */
  #web { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none;
         -webkit-filter: drop-shadow(0 0 5px rgba(255,190,100,.7)); filter: drop-shadow(0 0 5px rgba(255,190,100,.7)); }
  .edge {
    stroke: rgba(255,217,138,.85);
    stroke-width: 1.5;
    stroke-linecap: round;
    transition: stroke-dashoffset 1.2s ease;
  }
  #fill { fill: rgba(244,166,160,.2); opacity: 0; transition: opacity 2.4s ease; }
  #fill.on { opacity: 1; }

  /* the stars you tap */
  #stars { position: fixed; inset: 0; }
  .star {
    position: absolute;
    width: 56px; height: 56px;
    margin: -28px 0 0 -28px;
    padding: 0; border: 0; background: none;
    cursor: pointer;
    opacity: 0; transform: scale(.2);
    transition: opacity .8s ease, transform .9s cubic-bezier(.2,.8,.2,1);
  }
  .star.on { opacity: 1; transform: none; }
  .star:disabled { cursor: default; }
  .star::before {
    content: "";
    position: absolute; left: 50%; top: 50%;
    width: 12px; height: 12px; margin: -6px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, var(--gold) 45%, rgba(255,217,138,0) 72%);
    box-shadow: 0 0 18px 4px rgba(255,200,110,.55);
    transition: transform .6s ease, box-shadow .6s ease;
  }
  .star::after {
    content: "";
    position: absolute; left: 50%; top: 50%;
    width: 14px; height: 14px; margin: -7px;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    animation: ping 2.6s ease-out var(--d, 0s) infinite;
  }
  @keyframes ping {
    0%   { transform: scale(1);   opacity: .75; }
    100% { transform: scale(3.4); opacity: 0; }
  }
  .star.lit::before { transform: scale(1.6); box-shadow: 0 0 30px 9px rgba(255,200,110,.8); }
  .star.lit::after { animation: none; opacity: 0; }
  .star:focus-visible { outline: 2px solid var(--gold); outline-offset: -6px; border-radius: 50%; }

  /* first screen */
  .intro {
    position: fixed; left: 0; right: 0; top: 0; bottom: 0;
    max-width: 38rem; margin: 0 auto;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start;
    padding: 1.5rem 1.5rem calc(2.75rem + env(safe-area-inset-bottom, 0px));
    opacity: 0; transition: opacity 1.1s ease;
  }
  body.ready .intro { opacity: 1; }
  body.started .intro { opacity: 0; pointer-events: none; }
  .intro h1 {
    margin: 0 0 .9rem;
    font-weight: 300;
    font-size: clamp(2.3rem, 9.5vw, 4rem);
    line-height: 1.05;
    letter-spacing: -0.025em;
    text-wrap: balance;
  }
  .intro p { margin: 0; font-size: 1.15rem; line-height: 1.4; color: rgba(227,235,255,.72); }
  .go, .again {
    font: 500 1rem/1 var(--font);
    border-radius: 999px;
    padding: .95rem 2rem;
    cursor: pointer;
    transition: transform .2s ease, background .2s ease, color .2s ease;
  }
  .go { margin-top: 1.9rem; color: #1a1405; background: var(--gold); border: 0; }
  .go:hover { background: #ffe6ad; transform: translateY(-1px); }
  .go:focus-visible, .again:focus-visible { outline: 3px solid var(--mist); outline-offset: 4px; }

  /* the line of words at the bottom */
  .note {
    position: fixed; left: 0; right: 0;
    bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
    max-width: 38rem; margin: 0 auto;
    padding: 0 1.5rem;
    min-height: 8.5rem;
    opacity: 0; transition: opacity .9s ease;
    pointer-events: none;
  }
  .note.visible { opacity: 1; }
  .note > * { pointer-events: auto; }
  #noteText {
    margin: 0;
    font-weight: 300;
    font-size: clamp(1.4rem, 5.2vw, 2.1rem);
    line-height: 1.22;
    letter-spacing: -0.015em;
    text-wrap: balance;
    transition: opacity .3s ease;
  }
  #noteText.swap { opacity: 0; }
  #count { display: block; margin-top: .75rem; font-size: .9rem; color: rgba(227,235,255,.55); }
  .sign { margin: .9rem 0 0; font-weight: 500; font-size: 1.15rem; color: var(--gold); }
  .again { margin-top: 1.1rem; background: transparent; color: var(--mist); border: 1px solid rgba(227,235,255,.4); }
  .again:hover { background: var(--mist); color: var(--night); }
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .star::after { animation: none; opacity: .5; }
    .star, .edge, #fill, .intro, .note, #noteText { transition-duration: .01s; }
  }
</style>
</head>
<body>
  <div class="horizon" aria-hidden="true"></div>
  <canvas id="sky" aria-hidden="true"></canvas>
  <svg id="web" aria-hidden="true"><polygon id="fill"></polygon><g id="edges"></g></svg>
  <div id="stars"></div>

  <section class="intro" id="intro">
    <h1>I hung some stars up for you, Aysha.</h1>
    <p>There are ten. Each one is a reason.</p>
    <button class="go" id="go" type="button">Look up</button>
  </section>

  <section class="note" id="note" aria-live="polite">
    <p id="noteText"></p>
    <span id="count"></span>
    <p class="sign" id="sign" hidden></p>
    <button class="again" id="again" type="button" hidden>Look again</button>
  </section>

<script>
  /* ---------- Edit these ---------- */
  const HER = "Aysha";
  const HIS = "Muhammad Galo";

  // Keep this at exactly 10 lines: one per star in the heart.
  const REASONS = [
    "You make ordinary days feel lighter.",
    "You show up for me, even when I\u2019m hard to show up for.",
    "You listen like what I say matters.",
    "Your laugh is my favorite sound.",
    "You\u2019re more patient with me than I deserve.",
    "You make me want to be a better man.",
    "Wherever you are feels like home.",
    "You care in quiet ways, and I notice every one.",
    "I\u2019m more grateful for you than I say out loud.",
    `I love you, ${HER}. Today, next week, and every day after.`
  ];
  const FINAL = `That\u2019s the whole sky, ${HER}. Every star of it is you.`;
  const SIGN_OFF = `Always yours, ${HIS}`;
  /* -------------------------------- */

  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const N = REASONS.length;
  // Points along a heart curve, going around once. Chosen so the shape reads as a heart.
  const T = [0, 0.9, 1.3, 1.75, 2.1, Math.PI, -2.1, -1.75, -1.3, -0.9];
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const starsEl = $("stars"), edgesG = $("edges"), fillEl = $("fill"), web = $("web"),
        note = $("note"), noteText = $("noteText"), countEl = $("count"),
        signEl = $("sign"), againBtn = $("again");

  // Load the font before showing the first screen, so the text never switches fonts on screen.
  const fontsReady = Promise.race([
    document.fonts.load('300 1em "Bricolage Grotesque"'),
    new Promise(r => setTimeout(r, 3500))
  ]).catch(() => {});
  fontsReady.then(() => document.body.classList.add("ready"));

  const stars = [], edges = [], lit = new Set();
  let pts = [], started = false, finaleDone = false, shooting = false;

  for (let i = 0; i < N; i++) {
    const b = document.createElement("button");
    b.className = "star"; b.type = "button"; b.disabled = true;
    b.setAttribute("aria-label", `Star ${i + 1} of ${N}. Tap to read.`);
    b.style.setProperty("--d", ((i * 0.37) % 2.4).toFixed(2) + "s");
    b.addEventListener("click", () => tap(i));
    starsEl.appendChild(b); stars.push(b);

    const ln = document.createElementNS(NS, "line");
    ln.setAttribute("class", "edge");
    edgesG.appendChild(ln); edges.push(ln);
  }

  function layout() {
    const w = innerWidth, h = innerHeight;
    const top = parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0;
    const s = Math.min(w * 0.8 / 31, (h * 0.44) / 29.5);
    const cx = w / 2, cy = top + (h - top) * 0.36;
    pts = T.map(t => [
      cx + 16 * Math.pow(Math.sin(t), 3) * s,
      cy - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t) + 2.5) * s
    ]);
    web.setAttribute("viewBox", `0 0 ${w} ${h}`);
    stars.forEach((b, i) => { b.style.left = pts[i][0] + "px"; b.style.top = pts[i][1] + "px"; });
    edges.forEach((ln, i) => {
      const a = pts[i], c = pts[(i + 1) % N];
      ln.setAttribute("x1", a[0]); ln.setAttribute("y1", a[1]);
      ln.setAttribute("x2", c[0]); ln.setAttribute("y2", c[1]);
      const len = Math.hypot(c[0] - a[0], c[1] - a[1]).toFixed(1);
      ln.dataset.len = len;
      ln.style.strokeDasharray = len;
      ln.style.strokeDashoffset = ln.classList.contains("on") ? 0 : len;
    });
    fillEl.setAttribute("points", pts.map(p => p.join(",")).join(" "));
  }

  let swapTimer;
  function say(text, count, final) {
    clearTimeout(swapTimer);
    noteText.classList.add("swap");
    swapTimer = setTimeout(() => {
      noteText.textContent = text;
      countEl.textContent = count || "";
      signEl.hidden = !final; againBtn.hidden = !final;
      if (final) signEl.textContent = SIGN_OFF;
      noteText.classList.remove("swap");
    }, 300);
  }

  function setEdge(i, on) {
    const ln = edges[i];
    ln.classList.toggle("on", on);
    ln.style.strokeDashoffset = on ? 0 : ln.dataset.len;
  }

  function tap(i) {
    if (!started) return;
    stars[i].classList.add("lit");
    lit.add(i);
    if (lit.has((i + 1) % N)) setEdge(i, true);
    const prev = (i - 1 + N) % N;
    if (lit.has(prev)) setEdge(prev, true);
    say(REASONS[i], `${lit.size} of ${N}`);
    if (lit.size === N && !finaleDone) {
      finaleDone = true;
      setTimeout(() => {
        fillEl.classList.add("on");
        shooting = true;
        say(FINAL, "", true);
      }, 4800);
    }
  }

  $("go").addEventListener("click", () => {
    started = true;
    document.body.classList.add("started");
    stars.forEach((b, i) => setTimeout(() => { b.disabled = false; b.classList.add("on"); }, 500 + i * 230));
    setTimeout(() => {
      note.classList.add("visible");
      say("Tap a star.", `0 of ${N}`);
    }, 500 + N * 230 + 300);
  });

  againBtn.addEventListener("click", () => {
    lit.clear(); finaleDone = false; shooting = false;
    stars.forEach(b => b.classList.remove("lit"));
    edges.forEach((e, i) => setEdge(i, false));
    fillEl.classList.remove("on");
    say("Tap a star.", `0 of ${N}`);
  });

  /* ---------- background sky ---------- */
  const cv = $("sky"), ctx = cv.getContext("2d");
  let bg = [], streaks = [];

  function sizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.round(innerWidth * innerHeight / 6000);
    bg = Array.from({ length: count }, () => ({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight * 0.88,
      r: Math.random() * 1.2 + 0.3,
      p: Math.random() * 6.28,
      sp: 0.6 + Math.random() * 1.4
    }));
    if (reduce) frame(0);
  }

  function frame(t) {
    const w = innerWidth, h = innerHeight;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#fff";
    for (const s of bg) {
      ctx.globalAlpha = reduce ? 0.6 : 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t / 1000 * s.sp + s.p));
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    if (shooting && !reduce && Math.random() < 0.01) {
      streaks.push({ x: w * (0.35 + Math.random() * 0.65), y: Math.random() * h * 0.35,
                     vx: -(6 + Math.random() * 4), vy: 3 + Math.random() * 2, life: 1 });
    }
    streaks = streaks.filter(s => s.life > 0);
    for (const s of streaks) {
      s.x += s.vx; s.y += s.vy; s.life -= 0.012;
      const g = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 12, s.y - s.vy * 12);
      g.addColorStop(0, `rgba(255,240,210,${Math.max(s.life, 0)})`);
      g.addColorStop(1, "rgba(255,240,210,0)");
      ctx.globalAlpha = 1; ctx.strokeStyle = g; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 12, s.y - s.vy * 12); ctx.stroke();
    }
    if (!reduce) requestAnimationFrame(frame);
  }

  function resize() { layout(); sizeCanvas(); }
  window.addEventListener("resize", resize);
  resize();
  if (!reduce) requestAnimationFrame(frame);
</script>
</body>
</html>
